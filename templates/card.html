<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin:0;
    font-family:Arial;
}

.card{
    width:856px;
    height:540px;

    background:#111;
    color:white;

    border-radius:30px;
    padding:40px;

    box-sizing:border-box;
}

.logo{
    color:#a6ff00;
    font-size:60px;
    font-weight:bold;
}

.value{
    font-size:42px;
    margin-top:20px;
}

.report{
    font-size:20px;
    margin-top:40px;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo">
        EV DIAGNOSTIKA
    </div>

    <div class="value">
        SOH: {{ soh }} %
    </div>

    <div class="value">
        SOC: {{ soc }} %
    </div>

    <div class="value">
        KM: {{ odometer }}
    </div>

    <div class="report">
        {{ report_id }}
    </div>

</div>

</body>
</html>
